include=~/.config/mpv/ytdl.conf
save-position-on-quit
screenshot-directory=~/Pictures/mpvscreenshots/
input-ipc-server=/tmp/mpv.sock
prefetch-playlist
directory-mode=recursive
audio-channels=stereo
# Keep NVIDIA dGPU asleep: Vulkan loads its ICD, auto-safe probes CUDA
# Vulkan and hwdec=auto-safe (CUDA probe) wake the NVIDIA dGPU
gpu-api=opengl
hwdec=vaapi
