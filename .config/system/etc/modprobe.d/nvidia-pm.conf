# RTD3: lets the NVIDIA dGPU power off when idle.
# Apps that would wake it are pinned to the AMD iGPU:
#   mpv           gpu-api=opengl, hwdec=vaapi       (mpv/mpv.conf)
#   GTK4 apps     GSK_RENDERER=opengl               (environment.d/gtk.conf)
#   btop          shown_gpus = "amd intel apple"    (btop/btop.conf, btop#1838)
# Check: cat /sys/bus/pci/devices/0000:01:00.0/power/runtime_status
options nvidia "NVreg_DynamicPowerManagement=0x02"
