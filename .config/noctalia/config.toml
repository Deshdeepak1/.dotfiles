[shell]
font_family = "Mononoki Nerd Font Propo"
polkit_agent = true
# readline_shortcuts = true
settings_window_translucent = true

    [shell.launcher]
    category_icons_only = true
    width = 560

        [shell.launcher.dmenu.entry.ssh]
        command = "awk '/^Host / && $2 !~ /[*?]/ {print $2}' ~/.ssh/config"
        exec = "kitty ssh {selection}"
        prefix = "ssh"
        glyph = "server"

        [shell.launcher.dmenu.entry.train]
        command = "train --history"
        exec = "omnimenu train {selection}"
        prefix = "train"
        glyph = "train"

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"

    [shell.screenshot]
    directory = "~/Pictures/screenshots"
    filename_pattern = "%Y-%m-%d_%H-%M-%S"

    [shell.session]
    grid = true

[bar.default]
background_opacity = 0.0
capsule = true
compositor_blur = false
margin_edge = 4
margin_ends = 4
start = [ "launcher", "workspaces" ]
center = [ "claudecode", "clock" ]
end = [ "media", "privacy", "tray", "group:sysmon", "group:status", "control-center", "session" ]

    [[bar.default.capsule_group]]
    id = "sysmon"
    members = [ "temp", "cpu", "ram" ]

    [[bar.default.capsule_group]]
    id = "status"
    members = [ "notifications", "network", "bluetooth", "volume", "input_volume", "brightness", "battery" ]
    # accordion = true

[widget.claudecode]
type = "jrohland/claudecode:pill"

[widget.clock]
format = "{:%a %d %b, %H:%M}"
tooltip_format = "{:%A, %d %B %Y · week %V}"

[widget.privacy]
hide_inactive = true

[widget.tray]
drawer = false

[widget.media]
max_length = 120
title_scroll = "on_hover"
hide_when_no_media = true

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.input_volume]
show_label = false

[brightness]
enable_ddcutil = true
minimum_brightness = 0.02

[widget.brightness]
show_label = false

[widget.battery]
display_mode = "graphic"
show_label = true

[control_center.calendar]
show_week_numbers = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[dock]
enabled = true
auto_hide = true
background_opacity = 0.7
icon_size = 30
reserve_space = false
show_instance_count = false

[idle.behavior.lock]
enabled = true

[idle.behavior.screen-off]
enabled = true

[idle.behavior.lock-and-suspend]
enabled = true

[keybinds]
down = [ "Down", "Ctrl+n" ]
up = [ "Up", "Ctrl+p" ]

[lockscreen]
grace_period_seconds = 5

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 540.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

[notification]
history_retention_hours = 1
width = 500

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "niri", "hyprland" ]

[wallpaper]
directory = "~/wallpapers/"

    # [wallpaper.automation]
    # enabled = true

[hooks]
started = ["noctalia msg wallpaper-random"]

[plugins]
enabled = ["local/qr", "local/train", "jrohland/claudecode"]

[plugin_settings."jrohland/claudecode"]
popout_placement = "floating"
refresh_interval = 5
